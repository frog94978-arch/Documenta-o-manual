  <text x="292" y="232" font-family="Arial,sans-serif" font-size="12" fill="#28506c">
    <tspan x="292" dy="0">O OBJETO DO PRESENTE INSTRUMENTO É A</tspan><tspan x="292" dy="16">CONTRATAÇÃO DE EMPRESA IRMÃOS SILVA SA PARA</tspan><tspan x="292" dy="16">FORNECIMENTO DE COMBUSTÍVEIS (ÓLEO DIESEL S-10)</tspan><tspan x="292" dy="16">PARA ATENDER AS NECESSIDADES DA SECRETARIA</tspan><tspan x="292" dy="16">MUNICIPAL DE OBRAS, INFRAESTRUTURA E SERVIÇOS</tspan><tspan x="292" dy="16">URBANOS, NO ABASTECIMENTO DE VEÍCULOS,</tspan><tspan x="292" dy="16">MÁQUINAS E TRATORES DO MUNICÍPIO, CONVENIADOS</tspan><tspan x="292" dy="16">E CONTRATADOS, NO ÂMBITO DA PREFEITURA</tspan><tspan x="292" dy="16">MUNICIPAL DE SETE LAGOAS, NOS TERMOS DA TABELA</tspan><tspan x="292" dy="16">DESCRITA NO SUBITEM 5.1 DESTE CONTRATO,</tspan><tspan x="292" dy="16">CONFORME CONDIÇÕES E EXIGÊNCIAS ESTABELECIDAS</tspan><tspan x="292" dy="16">NESTE INSTRUMENTO E NO TERMO DE REFERÊNCIA, O</tspan><tspan x="292" dy="16">QUAL É PARTE INTEGRANTE DESTE INSTRUMENTO,</tspan><tspan x="292" dy="16">INDEPENDENTEMENTE DE TRANSCRIÇÃO.</tspan>
